name: Test Trick Sim

# For more info and troubleshooting help for this workflow, see the Continuous Integration
# page in the GUNNS Wiki.
#
# We'd rather use a pre-built Docker image with the dependencies already installed, but we
# don't have a place to store the image.  We can't use the GiHhub Container Registry or
# Package containers, and don't want to use Docker Hub, so we have to configure the
# container from scratch each time.

on:
  push:
    branches:
    - master
    paths-ignore:
    - 'README.md'
    - 'bin/utils/simbus_icd_input_gen/**'
    - '.github/workflows/**'
    - '!.github/workflows/sim_test.yml'
  pull_request:
  workflow_dispatch:

# Cancel obsolete runs for the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sim_test:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    container: docker://oraclelinux:8

    steps:
    - name: Update package manager
      run: |
        dnf -y install dnf-plugins-core https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
        dnf config-manager --set-enabled ol8_codeready_builder
        dnf -y update

    - name: Install Trick dependencies
      run: >
        dnf -y install 'dnf-command(config-manager)' dnf-plugins-core
        bison clang flex git llvm make maven swig cmake clang-devel
        gcc gcc-c++ java-11-openjdk-devel libxml2-devel llvm-devel llvm-static
        ncurses-devel openmotif openmotif-devel perl perl-Digest-MD5 udunits2
        udunits2-devel which zlib-devel libX11-devel libXt-devel python3-devel diffutils

    - name: Install GTest
      run: dnf install -y gtest-devel

    - name: Install GUNNS dependencies
      run: dnf install -y tk-devel

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24 supports Oracle Linux 8

    - name: Record compiler and package versions
      run: |
        mkdir -p ci-logs
        { cat /etc/os-release; gcc --version; g++ --version; make --version; python3 --version; rpm -qa | sort; } > ci-logs/toolchain.txt
        cat ci-logs/toolchain.txt

    - name: Build Trick
      # Failure here is likely due to new or changed dependencies of Trick, see above
      # For issue #93: we use the same fix as Trick for assigning JAVA_HOME, see:
      #   trick/.github/workflows/test_32_oracle.yml
      run: |
        export TRICK_HOME="/home/trick"
        export MAKEFLAGS=-j`nproc`
        export JAVA_HOME=$(dirname $(dirname $(readlink -f `which java`)))
        git init ${TRICK_HOME}
        git -C ${TRICK_HOME} remote add origin https://github.com/nasa/trick.git
        git -C ${TRICK_HOME} fetch --depth=1 origin e101223edcd31f18595dee77faadd861e2c134f9
        git -C ${TRICK_HOME} checkout --detach FETCH_HEAD
        test "$(git -C ${TRICK_HOME} rev-parse HEAD)" = "e101223edcd31f18595dee77faadd861e2c134f9"
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        git -C ${TRICK_HOME} show -s --format=fuller HEAD | tee "${GITHUB_WORKSPACE}/ci-logs/trick-version.txt"
        cd ${TRICK_HOME}
        ./configure 2>&1 | tee "${GITHUB_WORKSPACE}/ci-logs/trick-configure.log"
        make 2>&1 | tee "${GITHUB_WORKSPACE}/ci-logs/trick-build.log"
        ./bin/trick-config --version | tee -a "${GITHUB_WORKSPACE}/ci-logs/trick-version.txt"

    - name: Build prebuilt GUNNS libraries
      run: |
        export TRICK_HOME="/home/trick"
        export GUNNS_TRICK_HOME="${TRICK_HOME}"
        export GUNNS_HOME="${GITHUB_WORKSPACE}"
        export PATH="${TRICK_HOME}/bin:${PATH}"
        make -C lib/trick -j4 OPTS='-O2' 2>&1 | tee ci-logs/gunns-trick-build.log
        make -C lib/trick_if -j4 2>&1 | tee ci-logs/gunns-trick-if-build.log
        test -s lib/trick/libgunns.a
        test -s lib/trick_if/libgunns.o

    # TODO use better way to define env vars globally for all steps
    - name: Build sim
      run: |
        export TRICK_HOME="/home/trick"
        export MAKEFLAGS=-j`nproc`
        export GUNNS_HOME=`pwd`
        export MS_UTILS_HOME="${GUNNS_HOME}/ms-utils"
        export TS_MODELS_HOME="${GUNNS_HOME}/gunns-ts-models"
        export HS_CONFIG_PATH="${GUNNS_HOME}/sims/Modified_data"
        cd sims/SIM_test
        ${TRICK_HOME}/bin/trick-CP 2>&1 | tee "${GUNNS_HOME}/ci-logs/sim-build.log"
        grep -F "GUNNS trickified lib ${GUNNS_HOME}/lib/trick_if/libgunns.o is being included." "${GUNNS_HOME}/ci-logs/sim-build.log"

    - name: Run sim
      run: |
        export TRICK_HOME="/home/trick"
        export MAKEFLAGS=-j`nproc`
        export GUNNS_HOME=`pwd`
        export MS_UTILS_HOME="${GUNNS_HOME}/ms-utils"
        export TS_MODELS_HOME="${GUNNS_HOME}/gunns-ts-models"
        export HS_CONFIG_PATH="${GUNNS_HOME}/sims/Modified_data"
        cd sims/SIM_test
        # Remove the checked-in sample report so only this run can satisfy the gate.
        rm -f RUN_test/results/SIM_test_int_test_results.xml
        ./S_main* RUN_test/input_int_test.py 2>&1 | tee "${GUNNS_HOME}/ci-logs/sim-run.log"

    - name: Check sim outputs for pass/fail
      run: |
        export GUNNS_HOME=`pwd`
        cd test/CI
        chmod +x sim_test.py
        python3 ./sim_test.py

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sim_test-diagnostics
        retention-days: 7
        if-no-files-found: warn
        path: |
            ci-logs/**
            sims/SIM_test/build/MAKE_err
            sims/SIM_test/RUN_test/results/**
