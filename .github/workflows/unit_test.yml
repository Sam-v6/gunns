name: Unit Tests

# For more info and troubleshooting help for this workflow, see the Continuous Integration
# page in the GUNNS Wiki.

on:
  push:
    branches:
    - master
    paths-ignore:
    - 'README.md'
    - 'draw/**'
    - 'bin/utils/simbus_icd_input_gen/**'
    - '.github/workflows/**'
    - '!.github/workflows/unit_test.yml'
  pull_request:
  workflow_dispatch:

# Cancel obsolete runs for the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  all_unit_tests:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: docker://oraclelinux:8

    steps:
    - name: Update package manager
      run: |
        yum install -y yum-utils
        dnf config-manager --set-enabled ol8_codeready_builder
        yum repolist
        yum install -y epel-release && yum update -y

    - name: Install dependencies
      run: yum install -y tcsh make gcc gcc-c++ cppunit cppunit-devel lcov valgrind python3

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24 supports Oracle Linux 8

    - name: Record compiler and package versions
      run: |
        mkdir -p ci-logs
        { cat /etc/os-release; gcc --version; g++ --version; make --version; python3 --version; rpm -qa | sort; } > ci-logs/toolchain.txt
        cat ci-logs/toolchain.txt

    - name: Run tests
      run: |
        # Set environment variables
        export GUNNS_HOME=`pwd`
        export MS_UTILS_HOME="${GUNNS_HOME}/ms-utils"
        export TS_MODELS_HOME="${GUNNS_HOME}/gunns-ts-models"
        # Some unit tests can fail unless parallel make, probably a missing dependency
        # in the UT makefiles...
        export MAKEFLAGS="-j4"
        # Set file permissions needed by the parsing test
        chmod a-r ms-utils/parsing/test/file_no_permission.txt
        chmod a-r ms-utils/parsing/test/nopermission
        # Make & run unit tests
        cd test
        ./make_all_ut.sh 2>&1 | tee "${GUNNS_HOME}/ci-logs/unit-tests.log"
        # Scan results for pass/fail
        chmod +x scan_all_ut.py
        python3 ./scan_all_ut.py

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit_test-diagnostics
        retention-days: 7
        if-no-files-found: warn
        path: |
            ci-logs/**
            test/make_all_ut*.out
            **/output/unit-tests*.log
            **/output/asan.log*
            **/output/unit-tests.info
